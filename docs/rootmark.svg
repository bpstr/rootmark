<svg xmlns="http://www.w3.org/2000/svg" width="360" height="96" viewBox="0 0 360 96" role="img" aria-labelledby="title desc">
  <title id="title">Rootmark</title>
  <desc id="desc">Rootmark logo with a terminal prompt growing into a branching root mark.</desc>
  <style>
    .ink { fill: #17191a; stroke: #17191a; }
    .muted { fill: #737a80; stroke: #737a80; }
