    }
  </style>
  <g transform="translate(6 12)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect class="ink" x="1.5" y="1.5" width="69" height="69" rx="17" stroke-width="3"/>
    <path class="muted" d="M17 24h12l-7 7 7 7H17" stroke-width="3"/>
    <path class="ink" d="M43 20v24m0 0-11 9m11-9 11 9m-11-2v12" stroke-width="3"/>
