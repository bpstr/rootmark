name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/rootmark.yml
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Rootmark
        run: go build -trimpath -o rootmark ./cmd/rootmark
      - name: Build docs with Rootmark
        run: ./rootmark build
      - id: pages
        name: Configure Pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
